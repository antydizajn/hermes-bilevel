[build-system]
requires = ["setuptools>=77.0,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bilevel"
version = "0.1.0"
description = "Auditable bilevel optimization laboratory for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Paulina Janowska" },
  { name = "contributors" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hermes", "agent", "bilevel", "optimization", "evaluation", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/antydizajn/hermes-bilevel"
Documentation = "https://github.com/antydizajn/hermes-bilevel/tree/master/docs"
Issues = "https://github.com/antydizajn/hermes-bilevel/issues"
Source = "https://github.com/antydizajn/hermes-bilevel"

[project.entry-points."hermes_agent.plugins"]
bilevel = "hermes_bilevel.plugin:register"

[project.scripts]
hermes-bilevel = "hermes_bilevel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_bilevel*"]

[tool.setuptools.package-data]
hermes_bilevel = [
  "plugin.yaml",
  "skills/*/SKILL.md",
  "resources/**/*",
  "migrations/*.sql",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "security: security-critical tests",
  "compatibility: Hermes compatibility tests",
  "slow: slower integration tests",
]

[tool.coverage.run]
source = ["hermes_bilevel"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 71

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
packages = ["hermes_bilevel"]
mypy_path = "src"
