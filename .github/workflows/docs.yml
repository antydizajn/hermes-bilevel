name: docs
on:
  push:
    paths: ["docs/**", "README.md"]
  pull_request:
    paths: ["docs/**", "README.md"]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docs exist
        run: test -f docs/HERMES_COMPATIBILITY_AUDIT.md && test -f README.md
