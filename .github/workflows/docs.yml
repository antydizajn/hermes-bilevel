name: docs
on:
  push:
    paths: ["docs/**", "README.md"]
  pull_request:
    paths: ["docs/**", "README.md"]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check docs exist
        run: test -f docs/HERMES_COMPATIBILITY_AUDIT.md && test -f README.md
